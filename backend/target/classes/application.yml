server:
  port: 8080

spring:
  application:
    name: knowflow-ai-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
  datasource:
    url: jdbc:h2:mem:knowflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt:
    secret: "enterprise-knowflow-ai-super-secure-production-ready-jwt-secret-key-prod-2026"
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
  rag:
    similarity-threshold: 0.35
    max-retrieved-chunks: 5
    embedding-dimensions: 384
  llm:
    provider: ${LLM_PROVIDER:local} # "local" (deterministic grounded generator) or "openai"
    api-key: ${OPENAI_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}

logging:
  level:
    com.knowflow: INFO
    org.springframework.security: INFO
