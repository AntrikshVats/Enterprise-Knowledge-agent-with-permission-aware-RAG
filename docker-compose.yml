version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: knowflow-pgvector
    environment:
      POSTGRES_DB: knowflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema-pgvector.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: knowflow-backend
    environment:
      SPRING_PROFILES_ACTIVE: pgvector
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: knowflow
      DB_USER: postgres
      DB_PASSWORD: postgres
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: knowflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
